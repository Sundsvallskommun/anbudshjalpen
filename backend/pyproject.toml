[project]
name = "anbudsklar"
version = "0.1.0"
description = "Anbudshjälpen PoC: AI-stöd för småföretag i kommunens upphandlingar"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.0.43",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
    "pypdf>=6.0",
    "python-docx>=1.2",
    "rapidfuzz>=3.14",
    "beautifulsoup4>=4.13",
    "lxml>=6.0",
    "apscheduler>=3.11,<4",
    "aiosmtplib>=4.0",
    "openai>=2.0",
    "mcp>=1.30,<2",  # FastMCP API, same major as Eneo (mcp>=1.2,<2)
    "typer>=0.19",
    "tzdata>=2025.2",
]

[project.scripts]
anbudsklar = "anbudsklar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "respx>=0.22",
    "ruff>=0.13",
    "pyright>=1.1.406",
    "fpdf2>=2.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anbudsklar"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]  # asserts in tests; Swedish characters in strings

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"alembic/**" = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra"
