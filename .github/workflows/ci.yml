name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Same image, credentials and host port as the compose `db` service, so
      # backend/tests/conftest.py works without overrides.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: anbudsklar
          POSTGRES_PASSWORD: anbudsklar
          POSTGRES_DB: anbudsklar
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U anbudsklar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag after v7, so `@v10` does not resolve.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.17"
          working-directory: backend
      - name: Lockfile is up to date
        run: uv lock --check
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check --output-format github .
      - name: Format
        run: uv run ruff format --check .
      - name: Lint and format data scripts
        # The fixture and CPV generators in data/ use the backend's ruff settings.
        run: |
          uv run ruff check --config pyproject.toml --output-format github ../data
          uv run ruff format --config pyproject.toml --check ../data
      - name: Types
        run: uv run pyright
      - name: Tests
        run: uv run pytest -q

  frontend:
    name: Frontend (types, tests, theme, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Theme is rebuilt
        run: npm run theme:check
      - name: Build
        run: npm run build

  compose:
    name: Compose files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Local stack
        run: docker compose --env-file .env.example config --quiet
      - name: Dokploy, Anbudsklar
        # The template leaves secrets empty on purpose; supply placeholders for validation only.
        env:
          SESSION_SECRET: ci-placeholder
          POSTGRES_PASSWORD: ci-placeholder
          MAILPIT_UI_AUTH: ci:placeholder
        run: >-
          docker compose -f deploy/dokploy/docker-compose.anbudsklar.yml
          --env-file deploy/dokploy/anbudsklar.env.example config --quiet
      - name: Dokploy, Eneo test instance
        env:
          ENEO_POSTGRES_PASSWORD: ci-placeholder
          ENEO_REDIS_PASSWORD: ci-placeholder
          ENEO_JWT_SECRET: ci-placeholder
          ENEO_API_KEY_HASH_SECRET: ci-placeholder
          ENEO_URL_SIGNING_KEY: ci-placeholder
          ENEO_ENCRYPTION_KEY: ci-placeholder
          ENEO_ADMIN_EMAIL: ci@example.se
          ENEO_ADMIN_PASSWORD: ci-placeholder
        run: >-
          docker compose -f deploy/dokploy/docker-compose.eneo-test.yml
          --env-file deploy/dokploy/eneo-test.env.example config --quiet

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --tag anbudsklar:ci .
